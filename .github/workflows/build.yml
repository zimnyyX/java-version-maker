name: Build Windows Executables

on:
  push:
    branches: [ main, "*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Main Launcher
      run: |
        pyinstaller --noconsole --onefile --add-data "Java port/ms_auth.py;." "Java port/main_launcher.py"

    - name: Build Sub-Launcher
      run: |
        pyinstaller --noconsole --onefile --add-data "Java port/ms_auth.py;." "Java port/sub_launcher.py"

    - name: Prepare distribution
      run: |
        mkdir dist_zip
        cp "dist/main_launcher.exe" "dist_zip/"
        cp "dist/sub_launcher.exe" "dist_zip/"
        cp "Java port/ms_auth.py" "dist_zip/"
        cp "README.md" "dist_zip/"
        cp "requirements.txt" "dist_zip/"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Minecraft-Java-Port-Windows
        path: dist_zip/
